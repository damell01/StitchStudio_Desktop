name: Package Intel Mac installer

on:
  push:
    branches: [Dev]
    paths: [.github/workflows/package-intel-mac.yml, .github/scripts/check-macos-install.sh]
    tags: ['stitch-intel-test-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    if: github.ref == 'refs/heads/Dev' || startsWith(github.ref, 'refs/tags/stitch-intel-test-')
    runs-on: macos-15-intel
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop-ui
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source is on Dev
        run: git merge-base --is-ancestor HEAD origin/Dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri -> target
      - run: npm ci
      - name: Build the Intel DMG
        run: |
          test "$(uname -m)" = x86_64
          npm run tauri build -- --bundles app dmg -- --locked
      - name: Verify DMG and prepare diagnostic ZIP
        run: |
          for image in src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$image"
          done
          ditto -c -k --keepParent 'src-tauri/target/release/bundle/macos/Stitch Studio.app' src-tauri/target/release/bundle/Stitch-Studio-macOS-Intel.zip
          unzip -tq src-tauri/target/release/bundle/Stitch-Studio-macOS-Intel.zip
      - name: Check the installer and Intel app executable
        id: install
        run: bash ../.github/scripts/check-macos-install.sh src-tauri/target/release/bundle x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: Stitch-Studio-Mac-Intel
          path: |
            desktop-ui/src-tauri/target/release/bundle/dmg/*.dmg
            desktop-ui/src-tauri/target/release/bundle/Stitch-Studio-macOS-Intel.zip
          if-no-files-found: error
          compression-level: 0
      - if: failure() && steps.install.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Stitch-Studio-Mac-Intel-UNVALIDATED
          path: |
            desktop-ui/src-tauri/target/release/bundle/dmg/*.dmg
            desktop-ui/src-tauri/target/release/bundle/Stitch-Studio-macOS-Intel.zip
          if-no-files-found: error
          compression-level: 0
