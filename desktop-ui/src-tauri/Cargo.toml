[package]
name = "stitch-studio-desktop"
version = "0.1.0"
edition = "2024"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
zigzag = { path = "../..", features = ["ocr"] }
rfd = "0.15"

serde_json = "1"

tempfile = "3"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2"] }

