name: Digitizer regression
on:
  push:
    branches: [Dev]
  pull_request:
    branches: [Dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib
      - run: cargo test --tests
      - run: cargo check --bins
