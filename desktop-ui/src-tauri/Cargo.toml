[package]
name = "stitch-studio-desktop"
version = "0.1.0"
edition = "2024"
[build-dependencies]
tauri-build = { version = "2", features = [] }
zigzag = { path = "../.." }
serde_json = "1"
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
zigzag = { path = "../..", features = ["ocr"] }
rfd = "0.15"

serde_json = "1"

tempfile = "3"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }
reqwest = { version = "0.13", default-features = false }
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }

